<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - GourdSprite</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #e8f0fe 0%, #f5f5f7 40%, #fce8f0 100%);
    }

    .login-bg::before,
    .login-bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }

    .login-bg::before {
      width: 400px;
      height: 400px;
      background: #0071e3;
      top: -100px;
      right: -80px;
      opacity: 0.12;
    }

    .login-bg::after {
      width: 360px;
      height: 360px;
      background: #ff2d55;
      bottom: -100px;
      left: -60px;
      opacity: 0.1;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hover);
      padding: 40px 32px;
      animation: loginFadeIn 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-logo h1 span {
      color: var(--primary);
      -webkit-text-fill-color: var(--primary);
    }

    .login-logo p {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .login-input-wrap {
      position: relative;
      display: flex;
      gap: 10px;
    }

    .login-input {
      flex: 1;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .login-input::placeholder {
      color: var(--text-tertiary);
    }

    .login-input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
    }

    .login-input.error-border {
      border-color: #ff3b30;
    }

    .code-btn {
      flex-shrink: 0;
      padding: 12px 16px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      background: rgba(0, 113, 227, 0.08);
      color: var(--primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      min-width: 110px;
    }

    .code-btn:hover:not(:disabled) {
      background: var(--primary);
      color: white;
    }

    .code-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: var(--border);
      color: var(--text-tertiary);
      background: var(--bg);
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 8px;
    }

    .login-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: scale(1.01);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      min-height: 20px;
      font-size: 13px;
      color: #ff3b30;
      text-align: center;
      margin-top: 12px;
      opacity: 0;
      transition: var(--transition);
    }

    .login-error.show {
      opacity: 1;
    }

    .login-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 20px;
      line-height: 1.6;
    }

    .login-back {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .login-back:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">
      <h1><span style="color:var(--primary)">G</span>ourdSprite</h1>
      <p>登录</p>
    </div>

    <div class="login-field">
      <label>手机号</label>
      <div class="login-input-wrap">
        <input
          type="tel"
          id="phoneInput"
          class="login-input"
          placeholder="请输入 11 位手机号"
          maxlength="11"
          autocomplete="tel"
        >
        <button type="button" id="codeBtn" class="code-btn">获取验证码</button>
      </div>
    </div>

    <div class="login-field">
      <label>验证码</label>
      <input
        type="text"
        id="codeInput"
        class="login-input"
        placeholder="请输入 6 位验证码"
        maxlength="6"
        autocomplete="one-time-code"
      >
    </div>

    <button type="button" id="loginBtn" class="login-btn">登录</button>

    <div class="login-error" id="loginError"></div>

    <div class="login-hint">
      未注册手机号将自动创建账号
    </div>

    <a href="/" class="login-back">← 返回首页</a>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/auth.js"></script>
  <script>
    // 已登录则跳转首页
    if (isLoggedIn()) {
      window.location.href = '/';
    }

    var phoneInput = document.getElementById('phoneInput');
    var codeInput = document.getElementById('codeInput');
    var codeBtn = document.getElementById('codeBtn');
    var loginBtn = document.getElementById('loginBtn');
    var loginError = document.getElementById('loginError');

    var countdownTimer = null;

    // 显示错误信息
    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('show');
    }

    // 清除错误信息
    function clearError() {
      loginError.textContent = '';
      loginError.classList.remove('show');
    }

    // 显示 toast
    function showToast(message, type) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.background = type === 'error' ? '#ff3b30' : '#1d1d1f';
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2500);
    }

    // 手机号校验 (11 位中国大陆手机号)
    function isValidPhone(phone) {
      return /^1\d{10}$/.test(phone);
    }

    // 只允许输入数字
    phoneInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
      clearError();
    });

    codeInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
      clearError();
    });

    // 获取验证码
    codeBtn.addEventListener('click', async function () {
      var phone = phoneInput.value.trim();
      if (!isValidPhone(phone)) {
        showError('请输入正确的 11 位手机号');
        phoneInput.classList.add('error-border');
        return;
      }
      phoneInput.classList.remove('error-border');

      try {
        codeBtn.disabled = true;
        var res = await fetch('/api/auth/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phone })
        });
        var data = await res.json();
        if (!res.ok) {
          showError(data.error || '验证码发送失败');
          codeBtn.disabled = false;
          return;
        }
        // 开发模式：自动填入验证码
        if (data.code) {
          codeInput.value = data.code;
        }
        showToast('验证码已发送');
        startCountdown();
      } catch (e) {
        showError('网络错误，请重试');
        codeBtn.disabled = false;
      }
    });

    // 60 秒倒计时
    function startCountdown() {
      var seconds = 60;
      codeBtn.disabled = true;
      codeBtn.textContent = seconds + 's 后重发';
      countdownTimer = setInterval(function () {
        seconds--;
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          codeBtn.disabled = false;
          codeBtn.textContent = '获取验证码';
        } else {
          codeBtn.textContent = seconds + 's 后重发';
        }
      }, 1000);
    }

    // 登录
    loginBtn.addEventListener('click', doLogin);
    codeInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      clearError();
      var phone = phoneInput.value.trim();
      var code = codeInput.value.trim();

      if (!isValidPhone(phone)) {
        showError('请输入正确的 11 位手机号');
        return;
      }
      if (!code || code.length !== 6) {
        showError('请输入 6 位验证码');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phone, code: code })
        });
        var data = await res.json();
        if (!res.ok) {
          showError(data.error || '登录失败');
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
          return;
        }

        // 保存 token 和用户信息
        setToken(data.token);
        setCurrentUser(data.user);

        showToast('登录成功');
        // 跳转首页
        setTimeout(function () {
          window.location.href = '/';
        }, 500);
      } catch (e) {
        showError('网络错误，请重试');
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    }
  </script>
</body>
</html>
