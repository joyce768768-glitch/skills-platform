<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台管理 - GourdSprite</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth.js"></script>
  <script>
    // 路由保护: 未登录在渲染前跳转,避免页面闪烁
    if (!isLoggedIn()) {
      window.location.replace('/login.html');
      document.documentElement.innerHTML = '';
    }
  </script>
  <style>
    /* 平台管理页样式 */
    .pf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .pf-header h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .pf-header p {
      color: var(--text-secondary);
      margin-top: 4px;
      font-size: 14px;
    }

    /* Tab 切换器 */
    .pf-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 28px;
      width: fit-content;
    }

    .pf-tab {
      padding: 9px 20px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .pf-tab:hover {
      color: var(--text);
    }

    .pf-tab.active {
      background: var(--primary);
      color: white;
    }

    /* 指标卡片网格 */
    .pf-metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .pf-metric-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 24px 20px;
      transition: var(--transition);
    }

    .pf-metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .pf-metric-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .pf-metric-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .pf-metric-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* 最近注册用户 */
    .pf-section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pf-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .pf-recent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .pf-recent-item:last-child {
      border-bottom: none;
    }

    .pf-recent-info {
      flex: 1;
      min-width: 0;
    }

    .pf-recent-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pf-recent-phone {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .pf-recent-time {
      font-size: 13px;
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-left: 16px;
    }

    .pf-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-tertiary);
      font-size: 14px;
    }

    /* 用户表格 */
    .pf-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      overflow: hidden;
      overflow-x: auto;
    }

    .pf-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    .pf-table thead {
      background: var(--bg);
    }

    .pf-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
    }

    .pf-table td {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    .pf-table tbody tr:last-child td {
      border-bottom: none;
    }

    .pf-table tbody tr:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    .pf-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* 徽章 */
    .pf-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .pf-badge-admin {
      background: rgba(0, 113, 227, 0.1);
      color: var(--primary);
    }

    .pf-badge-user {
      background: var(--bg);
      color: var(--text-secondary);
    }

    .pf-badge-active {
      background: rgba(52, 199, 89, 0.12);
      color: #248a3d;
    }

    .pf-badge-disabled {
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
    }

    /* 可编辑姓名 */
    .pf-editable-name {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
    }

    .pf-editable-name:hover {
      background: var(--bg);
      color: var(--primary);
    }

    .pf-edit-icon {
      font-size: 11px;
      opacity: 0.5;
    }

    /* 危险按钮 */
    .pf-btn-danger {
      background: rgba(255, 59, 48, 0.08);
      color: #ff3b30;
      border: 1px solid rgba(255, 59, 48, 0.2);
    }

    .pf-btn-danger:hover {
      background: #ff3b30;
      color: white;
      border-color: #ff3b30;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .pf-metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .pf-header h1 {
        font-size: 26px;
      }

      .pf-tabs {
        width: 100%;
      }

      .pf-tab {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><span>G</span>ourdSprite</a>
      <ul class="nav-links">
        <li><a href="/github.html">资讯</a></li>
        <li><a href="/project.html">项目</a></li>
        <li><a href="/discover">Skills</a></li>
        <li><a href="/bookmarks.html">书签</a></li>
        <li><a href="/workbench.html">工作台</a></li>
        <li><a href="/knowledge.html">知识</a></li>
        <li><a href="/admin.html" class="active">平台管理</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="pf-header">
      <div>
        <h1>平台管理</h1>
        <p>查看平台指标与管理租户账号</p>
      </div>
    </div>

    <!-- Tab 切换器 -->
    <div class="pf-tabs">
      <button class="pf-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 平台看板</button>
      <button class="pf-tab" data-tab="tenants" onclick="switchTab('tenants')">👥 租户管理</button>
    </div>

    <!-- Tab 1: 平台看板 -->
    <div id="tabDashboard">
      <div class="pf-metrics-grid" id="metricsGrid">
        <!-- 指标卡片由 JS 渲染 -->
      </div>

      <h2 class="pf-section-title">🕐 最近注册用户</h2>
      <div class="pf-card" id="recentUsersList">
        <!-- 最近用户由 JS 渲染 -->
      </div>
    </div>

    <!-- Tab 2: 租户管理 -->
    <div id="tabTenants" style="display:none;">
      <div class="pf-table-wrap">
        <table class="pf-table">
          <thead>
            <tr>
              <th>手机号</th>
              <th>姓名</th>
              <th>角色</th>
              <th>状态</th>
              <th>在线时长</th>
              <th>最后登录</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <!-- 用户行由 JS 渲染 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/js/platform.js"></script>
</body>
</html>
